# iPhone/iPad settings, shipped inside the app bundle next to the binary (blz/ios).
# Game files: the extracted disc + default.xexp (Title Update 2) in the app's Documents/game folder
# (Files app, or `xcrun devicectl device copy to`); dantes_inferno_app.h OnConfigurePaths looks there first.

# Hell's Gate's native renderer (DiligentCore Vulkan on MoltenVK, blz/ios-native) draws; the SDK's Xenos plugin
# stays loaded for GPU sync only (gpu_host_rendering off). renderer = 'xenos' = the plugin draws everything (blz/ios).
renderer = 'dante'
gpu_plugin = 'xenos'
gpu_backend = 'vulkan'
# Phone defaults for the native renderer: game resolution (1280x720 targets), shadows at the original size.
dante_shadow_scale = 1
# PlayStation button prompts, as on the PS5 port (needs renderer = 'dante'). Markus plays with a Backbone One
# PlayStation Edition, which SDL reports as a generic pad, so 'auto' would pick Xbox prompts.
glyph_family = 'playstation5'


# On-screen FPS counter while the port is being tested (F1 toggles it on a keyboard).
show_fps_overlay = true

# Cheats (compiled into Markus's builds; true = on, restart the game after changing):
# dante_cheat_god = true      # take no damage, no knockback
# dante_cheat_one_hit = true  # every hit kills enemies
